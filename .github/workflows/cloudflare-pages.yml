name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      # LFS required so archive/2009 media (mp4/swf/ruffle) deploys as real files, not pointers.
      # Skip LFS in CI — lint/format only need text.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Inject Umami analytics
        run: npm run analytics:sync
        env:
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

      # Dependabot pull_request runs do not receive Actions secrets, so wrangler
      # cannot authenticate. The Cloudflare Git integration still publishes a preview.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.actor != 'dependabot[bot]'
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npx wrangler pages deploy . --project-name=adamsimms-xyz --branch="$HEAD_REF"
          else
            npm run deploy
          fi
          # Cloudflare shortens and sanitizes branch aliases, so read the URL wrangler reports.
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n 1 || true)
          case "$url" in http*|"") ;; *) url="https://$url" ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Preview deployment')
            });

            const commentBody = `## Preview deployment ready

            Your changes have been deployed to Cloudflare Pages.

            **Preview URL:** ${process.env.PREVIEW_URL}

            This preview will update automatically with each new commit.`;

            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
