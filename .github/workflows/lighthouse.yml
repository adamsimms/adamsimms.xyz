name: Lighthouse Performance Audit

on:
  # Manual only. The nightly schedule failed every run since 2026-08-08 against lighthouse-budget.json.
  workflow_dispatch:

jobs:
  lighthouse:
    name: Run Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Audit production URL and check budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://adamsimms.xyz/
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
